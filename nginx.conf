worker_processes auto;
error_log /var/log/nginx/error.log warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    upstream ollama { server ollama:11434; }
    server {
        listen 80;
        server_name api.fcukoffai.com;
        location / { return 301 https://$host$request_uri; }
    }
    server {
        listen 443 ssl;
        server_name api.fcukoffai.com;
        ssl_certificate /etc/letsencrypt/live/api.fcukoffai.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.fcukoffai.com/privkey.pem;
        location / {
            set $vk 0;
            if ($http_authorization = "Bearer sk-fcukoffai-15e327ce41482f717ef84ad39de37dd32fef4235d7429fc29c330de90f147f54") { set $vk 1; }
            if ($vk = 0) { return 401 'Invalid API key.'; }
            proxy_pass http://ollama;
            proxy_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
        }
    }
}